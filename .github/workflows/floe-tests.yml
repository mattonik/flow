name: Floe — design tokens and Python tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Token consistency and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify generated Floe palettes
        run: python3 design/scripts/generate_theme.py --check
      - name: Check Python syntax
        run: python3 -m compileall -q session design/scripts tests
      - name: Run Python unit tests and WCAG color regression tests
        run: python3 -m unittest discover -s tests -v

  module:
    name: NixOS module evaluation and Niri config
    # The test configuration is aarch64-linux, so its Flow pieces build natively here. Nothing is
    # compiled: everything but Flow's own small derivations comes from cache.nixos.org.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Evaluate the test system
        run: nix eval .#nixosConfigurations.test.config.system.build.toplevel.drvPath
      - name: Build Flow's wrappers and validate the rendered Niri config
        run: nix build -L --no-link .#checks.aarch64-linux.module
